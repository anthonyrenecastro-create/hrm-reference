name: reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate smoke configuration
        run: hrm validate-config configs/minimal.yaml
      - name: Run deterministic smoke task
        run: hrm run --config configs/minimal.yaml --output artifacts/ci-smoke
      - name: Verify attribution ledger
        run: hrm ledger verify artifacts/ci-smoke
      - name: Verify deterministic replay
        run: hrm replay artifacts/ci-smoke
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-evidence
          path: artifacts/ci-smoke
          if-no-files-found: ignore
          retention-days: 14
