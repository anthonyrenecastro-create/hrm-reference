name: reproducibility

on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: hrm run --config configs/minimal.yaml --output artifacts/ci-smoke
      - run: hrm ledger verify artifacts/ci-smoke
      - run: hrm replay artifacts/ci-smoke
