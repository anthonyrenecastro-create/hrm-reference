[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-reference"
version = "0.1.1"
description = "Deterministic, attributed reference implementation of the Helical Recursive Manifold"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Anthony Castro"}]
keywords = ["hybrid dynamical systems", "graph computation", "reaction diffusion", "attribution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.98",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]

[project.scripts]
hrm = "hrm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: canonical experiments that are not part of the CPU smoke suite",
  "scientific: mechanism-gate or outcome experiments",
]

[tool.coverage.run]
branch = true
source = ["hrm"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
incremental = false
cache_dir = "/dev/null"
# NumPy's public ndarray alias changed generic arity across supported NumPy
# releases; shape/dtype contracts are still checked explicitly at runtime.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
